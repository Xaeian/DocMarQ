# Generated by workflow.py

name: Publish PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev
      - run: pip install build
      - run: python -m build
      - run: pip install pytest "$(echo dist/*.whl)[all]"
      # pyproject carries the pytest config; no source tree beside it, so the wheel answers
      - run: mkdir /tmp/t && cp -r tests pyproject.toml /tmp/t/
      - run: cd /tmp/t && python -m pytest tests
      - uses: pypa/gh-action-pypi-publish@release/v1
